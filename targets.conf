  -bcm27xx-bcm2708      # 0 / 5     Raspberry Pi 1
  -bcm27xx-bcm2709      # 0 / 1     Raspberry Pi 2
  ipq40xx-generic       # 73 / 1898
  ipq40xx-mikrotik      # 0 / 14
  ipq806x-generic       # 0 / 26
  lantiq-xrx200         # 7 / 478   Pflicht (FRITZ!Box 7360/7362/7412)
  lantiq-xway           # 0 / 31
  mediatek-filogic      # 58 / 343
  mediatek-mt7622       # 1 / 56
  mpc85xx-p1010         # 4 / 164   Pflicht (TL-WDR4900 v1)
  mpc85xx-p1020         # 5 / 167
  ramips-mt7620         # 3 / 64    Pflicht (Archer C20i)
  ramips-mt7621         # 191 / 2977
  ramips-mt76x8         # 21 / 1328 Pflicht (19x Netgear R6120)
  rockchip-armv8        # 0 / 76
  -sunxi-cortexa7       # 0 / 0
  x86-generic           # 3 / >=10  Pflicht; bei anderen unscharf (Karte kennt nur das Modell), neue Installationen besser x86-64
