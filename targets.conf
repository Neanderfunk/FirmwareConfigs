# ---------------------------------------------------------------------------
# targets.conf - welche Hardware die Sackgasse (Gluon v2021.1) baut
#
# Gebaut werden nur Targets mit Geraeten, die Gluon nach v2021.1 aufgegeben
# hat bzw. die unser stable (v2023.2) nicht erreicht: Deren Knoten bleiben auf
# der Sackgasse stehen. Alle anderen
# Targets der Gluon-2021.1-Liste stehen auskommentiert unten; deren Geraete
# bekommen ihr Update aus stable.
#
# Die Reihenfolge ist zugleich die Baureihenfolge. Ein Target wird
# deaktiviert, indem ihm ein "-" vorangestellt wird (wie in v2025.1.x).
# scripts/build-local.sh nimmt diese Liste, wenn keine Targets uebergeben
# werden.
#
# Spalten im Kommentar: Geraete im Target, die nur die Sackgasse bedient |
# Knoten auf der Neanderfunk-Karte | Knoten im Gluon-Census Darmstadt ohne uns
# ("Eulenfunk" heraus). Erhoben 05.10.2026: Geraeteliste aus Gluon v2021.1.2
# targets/ (device, aliases, manifest_aliases), abgeglichen mit dem
# stable.manifest von stable.2023.2.6-26091920sta (13_dusfl);
# Knotenmodelle zugeordnet wie libplatforminfo (Modellname klein, Sonderzeichen
# zu "-"), Raspberry Pi ueber den Modelltext.
# Werkzeug fuer die Abdeckung: router-werkstatt
# werkzeug/firmwareserver/manifeste-zusammenfuehren.sh -g.
# DAP-1330 A1 und WNDRMAC v2 zaehlen nicht mehr mit: Sie bekommen ueber einen
# Alias das 2023.2-Image (OpenWrt ath79 nimmt den ar71xx-Namen an), ebenso
# NanoStation (loco) M XW (Alias seit 05.10.2026, Sprung an einer Station in
# RDV erprobt). WNDR3700 v4 bleibt bewusst auf der Sackgasse (kein sicherer Weg).
# ---------------------------------------------------------------------------

# Neanderfunk-Feldbau 05.10.2026 (adorfer): nur tiny und generic; die vier mit
# "-" haben auf unserer Karte 0 Knoten. Fuer andere Communities wieder an.
GLUON_TARGETS=(
  ar71xx-tiny           # 57 Geraete | 222 | 5104   4/32: WR841N/ND, WR740N, WA901ND, MR3020 ..., DIR-615 C1 (0 | 0)
  ar71xx-generic        # 39 Geraete |  14 |  895   WR1043N/ND v1, WR842N/ND v1/v2, Loco M XW, Bullet M, RE450, WR841N mod-8M/16M
  -ar71xx-mikrotik      #  5 Geraete |   0 |    0   RB NOR 16M (auch -ac), RB NAND 64M/large
  -ar71xx-nand          #  1 Geraet  |   0 |    4   Netgear WNDR3700 v4
  -ramips-rt305x        #  5 Geraete |   0 |    3   A5-V11, DIR-615 D/H1, VoCore 8M/16M
  -ipq40xx-generic      #  2 Geraete |   0 |    0   EnGenius ENS620EXT, ZyXEL WRE6606
)

# Alle Geraete dieser Targets bedient stable (v2023.2), daher nicht gebaut:
#  ath79-generic
#  brcm2708-bcm2710
#  ipq806x-generic
#  lantiq-xrx200
#  lantiq-xway
#  mpc85xx-generic
#  mpc85xx-p1020
#  ramips-mt7620
#  ramips-mt7621
#  ramips-mt76x8
#  x86-generic
#  x86-64

