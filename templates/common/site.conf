-- Configuration Template for Neanderfunk / Eulenfunk - Gluon 2023.2.x
{
  hostname_prefix = 'SITEBIG-',
  site_name = 'DOMAINLONGNAME',
  site_code = 'METAPREFIX-DOMAINNR_SITESMALL',

  -- Must be the same of all nodes in one mesh domain
  domain_names = { ['FFPREFIXMETAPREFIX-DOMAINNRSITESMALL'] = 'DOMAINNAME' },
  domain_seed = 'DOMAINHASH',

  config_mode = {
    hostname = {
      optional = false,
    },
    owner = {
      obligatory = false,
    },

    geo_location = {
      show_altitude = true,
      osm = {
      center = {
        lat = MAPLAT,
        lon = MAPLON,
      },
      zoom = MAPZOOM,
      tile_layer = {
        type = 'XYZ',
	url = 'https://tiles.ffdus.de/a.tile.openstreetmap.org/{z}/{x}/{y}.png',
	attributions = '&#169; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors.',
	},
      },
    },
    owner = {
      optional = false,
      obligatory = true,
    },
    remote_login = {
      show_password_form = true,
      min_password_length = 12,
    },
  },

  setup_mode = {
    skip = SETUPSKIP,
    -- Setup-WLAN setup.gluon_<letzte 4 Hexziffern der MAC> (Paket
    -- neanderfunk-setup-wifi): erst auf kurzen Tastendruck (<3 s) im
    -- Setup-Mode, dann offen, nach timeout Sekunden wieder aus; erneuter
    -- Druck startet den Timeout neu. 'open' laesst check_site nur mit
    -- 'button' zu (physischer Zugriff). Ohne den Block: sofort beim Boot,
    -- WPA2 freifunk_<erstes MAC-Byte>.
    -- Ausnahme Genexis Pulse EX400: dort zaehlt die kapazitive WPS-Flaeche
    -- als Taste, und die loest bekanntermassen auch mal von selbst aus. Im
    -- Setup-Mode kann das offene WLAN dort also ohne Finger angehen.
    -- Hingenommen: bei der Einrichtung hat man das Geraet im Blick.
    wifi = {
      start = 'button',   -- 'off' | 'boot' | 'button'
      security = 'open',  -- 'open' | 'wpa2' (dann key = 'freifunk_' o. ae.)
      timeout = 1200,
    },
  },
  authorized_keys = { 
KEYFILESSH
	},

  -- Kein 'openwrt'-Schluessel. Ohne ihn laesst 500-opkg die distfeeds.conf des
  -- Images unveraendert stehen und kommentiert allein openwrt_core aus. Die
  -- Zeilen darin zeigen auf genau den OpenWrt-Stand, gegen den gebaut wurde
  -- (24.10-SNAPSHOT), und wandern beim naechsten Gluon-Sprung von selbst mit -
  -- anders als eine feste Versionsnummer, die hier vorher stand (23.05.5) und
  -- unter 2025.1 ins Leere lief. %v hilft dabei nicht: VERSION_ID ist
  -- "24.10-snapshot", 500-opkg streicht das "-snapshot", und
  -- downloads.openwrt.org/releases/24.10/ gibt es nicht (404) - nur
  -- 24.10-SNAPSHOT und die Punktreleases. Freifunk Aachen macht es genauso.
  --
  -- Ein eigener Spiegel waere nur noetig, wenn die Knoten nicht ans offene Netz
  -- duerfen. Dann Darmstadts Weg: openwrt = '<spiegel>/packages-%v/%A'.
  --
  -- Kernelmodule kommen nicht von downloads.openwrt.org: openwrt_core ist von
  -- Gluon absichtlich abgeschaltet, weil kmods gegen genau unseren Kernel
  -- gebaut sein muessen. Die liefert unser eigener modules-Feed unten, 892
  -- kmod-Pakete aus demselben Bau wie das Image.
  opkg = {
    extra = {
      -- Kernelmodule: genau eine Quelle, und das ist Absicht. kmods muessen
      -- gegen exakt unseren Kernel gebaut sein, ein zweiter Anbieter waere
      -- kein Rueckfall, sondern eine Fehlerquelle. Das Schema
      -- gluon-<release>/<target> legt build.sh beim Veroeffentlichen an.
      gluonffnef = 'http://OPKGFQDN/firmware/modules/gluon-%GR/%S',

      -- Zweite Quelle fuer die OpenWrt-Pakete. Die erste sind die
      -- Image-eigenen distfeeds auf downloads.openwrt.org, die stehenbleiben,
      -- weil wir 'openwrt' nicht setzen.
      --
      -- Die Version steht hier fest und muss beim naechsten Gluon-Sprung mit.
      -- Anders geht es nicht: %v ergibt "24.10", und
      -- downloads.openwrt.org/releases/24.10/ gibt es nicht - der Baum heisst
      -- 24.10-SNAPSHOT. Genau das ist der Stand, gegen den wir bauen.
      --
      -- ftp.halifax.rwth-aachen.de spiegelt den SNAPSHOT-Baum vollstaendig
      -- (base, luci, packages, routing, telephony, alle geprueft) und liegt
      -- nah. mirror.netcologne.de und mirror.dogado.de fallen aus, die haben
      -- nur die Punktreleases. Weitere Kandidaten mit vollstaendigem Baum:
      -- ftp.gwdg.de/pub/linux/openwrt und mirror-03.infra.openwrt.org
      -- (letzterer nur ueber https).
      owrt2base = 'http://ftp.halifax.rwth-aachen.de/openwrt/releases/24.10-SNAPSHOT/packages/%A/base',
      owrt2luci = 'http://ftp.halifax.rwth-aachen.de/openwrt/releases/24.10-SNAPSHOT/packages/%A/luci',
      owrt2packages = 'http://ftp.halifax.rwth-aachen.de/openwrt/releases/24.10-SNAPSHOT/packages/%A/packages',
      owrt2routing = 'http://ftp.halifax.rwth-aachen.de/openwrt/releases/24.10-SNAPSHOT/packages/%A/routing',
      owrt2telephony = 'http://ftp.halifax.rwth-aachen.de/openwrt/releases/24.10-SNAPSHOT/packages/%A/telephony',

      -- Gluon-, community- und unsere eigenen Pakete, aus demselben Bau wie
      -- das Image und mit demselben Schluessel signiert. build.sh sammelt sie
      -- aus bin/packages/<arch>/ ein (collect_opkg_feeds).
      --
      -- Vorher standen hier ffac-Feeds. Die scheitern an der
      -- Signaturpruefung: /etc/opkg.conf setzt "option check_signature", das
      -- Image vertraut genau zwei Schluesseln - unserem Bau-Schluessel
      -- (140c897b1c81e27a, "Local build key") und OpenWrts 24.10-Schluessel
      -- (d310c6f2833e97f7). repo.ffac.rocks signiert mit 58a72b56a2519719,
      -- der liegt nirgends im Baum. Das galt schon fuer die 2023.2-Fassung.
      ffnefgluon = 'http://OPKGFQDN/firmware/opkg-2025.1.x/gluon-%GR/%S/gluon',
      ffnefgluonbase = 'http://OPKGFQDN/firmware/opkg-2025.1.x/gluon-%GR/%S/gluon_base',
      ffnefcommunity = 'http://OPKGFQDN/firmware/opkg-2025.1.x/gluon-%GR/%S/community',
      ffnefneanderfunk = 'http://OPKGFQDN/firmware/opkg-2025.1.x/gluon-%GR/%S/neanderfunk',
    },
  },

  prefix4 = '10.0.0.0/8',
  prefix6 = 'V6PREFIX::/64',
  extra_prefixes6 = {
    -- for ebtables-source-filter
    '2a03:2260::/32',
    '2a13:fcc0::/29', -- FNSH Freie Netze Suedhessen (AS62028), darin 2a13:fcc0:2f00::/48
  },

  timezone = 'CET-1CEST,M3.5.0,M10.5.0/3',

  ntp_servers = {
    'ntp6.SUPERNODETLD',
    'ntp.FFPREFIXMETAPREFIX.freifunk',
    '0.openwrt.pool.ntp.org',
    '2.openwrt.pool.ntp.org',
  },
  regdom = 'DE',

  wifi24 = {
    channel = WIFICH24,
    preserve_channels = 1,
    ap = {
      ssid = 'Freifunk',
      -- Eigene, sichtbare OWE-SSID ohne Transition Mode (adorfer 01.10.2026):
      -- nutzt nur, wer sie bewusst waehlt; am offenen 'Freifunk' aendert
      -- sich nichts. Nur auf Geraeten mit wpa3-Feature, siehe
      -- image-customization.lua. Umstieg auf owe_transition_mode erst, wenn
      -- rund 95 % der Knoten auf 2025.1.x laufen (Clients merken sich OWE
      -- und meiden danach womoeglich offene Knoten gleicher SSID).
      owe_ssid = 'Freifunk verschluesselt',
    },
    mesh = {
      id = 'MESHSSID',
      mcast_rate = 24000,
      disabled = false,
    },
  },
  wifi5 = {
    channel = WIFICH5,
    outdoor_chanlist = '100-140',
    ap = {
      ssid = 'Freifunk',
      -- Eigene, sichtbare OWE-SSID ohne Transition Mode (adorfer 01.10.2026):
      -- nutzt nur, wer sie bewusst waehlt; am offenen 'Freifunk' aendert
      -- sich nichts. Nur auf Geraeten mit wpa3-Feature, siehe
      -- image-customization.lua. Umstieg auf owe_transition_mode erst, wenn
      -- rund 95 % der Knoten auf 2025.1.x laufen (Clients merken sich OWE
      -- und meiden danach womoeglich offene Knoten gleicher SSID).
      owe_ssid = 'Freifunk verschluesselt',
    },
    mesh = {
      id = 'MESHSSID',
      mcast_rate = 24000,
      disabled = false,
    },
  },

  usteer = {
    network = {
      enabled = true,
      wireless = true,
      wired = true,
      update_interval = 5000,
      update_timeout = 12,
    },
    band_steering = {
      enabled = true,
      min_snr = -60,
      interval = 20000,
    }
  },



  next_node = {
    name = {
      'nextnode',
      'nn',
    },
    -- anycast IPs of all nodes
    ip4 = 'V4PREFIX.1',
    ip6 = 'V6PREFIX::1',
  },
  -- Lebensdauern der Router Advertisements. uradvd bekommt die Werte direkt
  -- als --preferred-lifetime und --valid-lifetime durchgereicht (siehe
  -- gluon-mesh-batman-adv/luasrc/lib/gluon/radvd/arguments).
  --
  -- Ohne diesen Block gaelten uradvds Voreinstellungen: 14400 s preferred und
  -- 86400 s valid, also 4 bzw. 24 Stunden. So lange haelt ein Client dann ein
  -- Praefix fest, das es nicht mehr gibt - etwa nachdem ein Knoten die Domain
  -- gewechselt hat. Kuerzer ist hier besser.
  --
  -- Untergrenze ist das RA-Intervall: uradvd sendet hoechstens alle 600 s
  -- (MaxRtrAdvInterval, per site.conf nicht einstellbar). 1260 s sind gut zwei
  -- Intervalle, ein Client darf also eine Ansage verpassen, ohne seine Adresse
  -- zu verlieren. Auf eine Router Solicitation antwortet uradvd ohnehin sofort.
  --
  -- Bedingung von uradvd: preferred <= valid, sonst startet es nicht.
  radvd = {
    preferred_lifetime = 1260,   -- 21 min
    valid_lifetime = 7200,       -- 2 h
  },

  interfaces = {
    lan = {
      default_roles = { 'mesh' },
    },
    wan = {
      default_roles = { 'uplink' },
    },
    single = {
      default_roles = { 'uplink' },
    },
  },
  poe_passthrough = true,

  -- Options specific to routing protocols (optional)
  mesh = {
      vxlan = false,
      filter_membership_reports = true,
      -- Options specific to the batman-adv routing protocol (optional)
      batman_adv = {
          -- Gateway selection class (optional)
          -- The default class 20 is based on the link quality (TQ) only,
          -- class 1 is calculated from both the TQ and the announced bandwidth
          gw_sel_class = 1,
          routing_algo = 'BATMAN_IV',
      },
  },

  mesh_vpn = {
    enabled = true,
    pubkey_privacy = true,
    tunneldigger = {
      mtu = 1364,
      brokers = {'ganymed.SUPERNODETLD:200DOMAINNR','kallisto.SUPERNODETLD:200DOMAINNR','amalthea.SUPERNODETLD:200DOMAINNR','himalia.SUPERNODETLD:200DOMAINNR','elara.SUPERNODETLD:200DOMAINNR','pasophae.SUPERNODETLD:200DOMAINNR','sinope.SUPERNODETLD:200DOMAINNR','lysithea.SUPERNODETLD:200DOMAINNR'},
    },
    bandwidth_limit = {
      enabled = false,
      egress =  10000,
      ingress = 30000,
    },
  },


  autoupdater = {
    enabled = 1,
    branch = 'RELBRANCH',
    branches = {
      stable = {
        name = 'stable',
	prefill = true, 
        mirrors = {
          'http://FWWEBSITEHOST.DOMAINNR-SITESMALL.FWWEBSITETLD/firmware/stable/DOMAINNR_SITESMALL/sysupgrade',
          'http://FWWEBSITEHOST.DOMAINNR-SITESMALL.FFPREFIXMETAPREFIX/firmware/stable/DOMAINNR_SITESMALL/sysupgrade',
          'http://FWWEBSITEHOST.FWWEBSITETLD/firmware/stable/DOMAINNR_SITESMALL/sysupgrade',
          'http://[V6PREFIX::733]/firmware/stable/DOMAINNR_SITESMALL/sysupgrade',
        },
        good_signatures = 3,
        pubkeys = {
KEYFILESIGN
        },
      },
      broken = {
        name = 'broken',
        mirrors = {
          'http://FWWEBSITEHOST.DOMAINNR-SITESMALL.FWWEBSITETLD/firmware/broken/DOMAINNR_SITESMALL/sysupgrade',
          'http://FWWEBSITEHOST.DOMAINNR-SITESMALL.FFPREFIXMETAPREFIX/firmware/broken/DOMAINNR_SITESMALL/sysupgrade',
          'http://FWWEBSITEHOST.FWWEBSITETLD/firmware/broken/DOMAINNR_SITESMALL/sysupgrade',
          'http://[V6PREFIX::733]/firmware/broken/DOMAINNR_SITESMALL/sysupgrade',
        },
        good_signatures = 1,
        pubkeys = {
KEYFILESIGN
        },
      },
    },
  },
  nodeplacer = {
    -- only http:// is accepted here, check_site.lua matches on '^http://'
    mirrors = {
      'http://FWWEBSITEHOST.FWWEBSITETLD/firmware/nodeplacer',
      'http://[V6PREFIX::733]/firmware/nodeplacer',
    },
    good_signatures = 3,
    -- pubkeys defaults to those of the configured autoupdater branch
    disable = 0,
  },
  roguenets_filter = {
    allowed_prefix4 = '10.0.0.0/8',
    allowed_prefix6 = '2a03:2260::/29',
    additional_prefix6 = {
      'fda0:300e::/32',
      '2a13:fcc0::/29',
    },
  },
  dns = {
    cacheentries = 1024,
    servers = { 'V6PREFIX::SUPERNODEDEFAULT','2620:fe::10', '2001:4860:4860::8844', '2001:4860:4860::8888', },
  },
  ssid_changer = {
    enabled = true,
    switch_timeframe = 2,     -- only once every timeframe (in minutes) the SSID will change to OFFLINE
                              -- set to 1440 to change once a day
                              -- set to 1 minute to change every time the router gets offline
    first = 10,                -- the first few minutes directly after reboot within which an Offline-SSID always may be activated
    prefix = 'FF_Offline_',   -- use something short to leave space for the nodename (no '~' allowed!)
    suffix = 'nodename',      -- generate the SSID with either 'nodename', 'mac' or to use only the prefix: 'none'

    tq_limit_enabled = true,  -- if false, the offline SSID will only be set if there is no gateway reacheable
                              -- upper and lower limit to turn the offline_ssid on and off
                              -- in-between these two values the SSID will never be changed to prevent it from toggeling every minute.
    tq_limit_max = 45,        -- upper limit, above that the online SSID will be used
    tq_limit_min = 35,        -- lower limit, below that the offline SSID will be used
    gwofflinemaxcount = 3,    -- after how many gluon "has_default_gw4" check intervalls offline ssid is set. 
  },

  wifi_blackout = {
    blackoutwait = 171,      -- Minuten ohne jede assoziierte Station, bevor gehandelt wird
    resetwait = 281,         -- Minuten Mindestabstand zwischen zwei Aktionen
    stepsize = 10,           -- Minuten zwischen zwei Pruefungen (Cron-Periode)
  },
  ap_timer = {
    -- Seite "AP Timer" in den Erweiterten Einstellungen (neanderfunk-ap-timer).
    -- Vorgabe des Pakets ist ebenfalls true; hier ausdruecklich, damit es
    -- sichtbar ist. Mit false bleibt die Seite nur auf Knoten, deren Timer
    -- schon laeuft (damit er sich dort abschalten laesst).
    web = true,
  },
  node_whisperer = {
    enabled = true,
    information = {
      'hostname',
      'node_id',
      'uptime',
      'site_code',
      -- 'domain' bewusst nicht: liefert auf Single-Domain-Firmware nichts,
      -- der Daemon wertet das als Fehler und loggt alle 30 s
      -- "Error collecting Information for id=4 name=domain code=-1".
      'system_load',
      'firmware_version',
      -- 'batman_adv' bleibt bewusst drin, obwohl das Protokoll in Byte 0 nur
      -- vpn.connected kennt: die 395 Knoten ohne VPN-Tunnel (35 % der
      -- Online-Knoten) erscheinen in der App dadurch faelschlich offline.
      -- Bewusst in Kauf genommen, damit die uebrigen ihre Mesh-Daten senden.
      -- Reparabel nur upstream, durch ein zusaetzliches Feld im Protokoll.
      'batman_adv'
    }
  },
  neanderfunk = {
    -- Zeilen im gemeinsamen Reboot-Log der neanderfunk-Pakete, 0 schaltet es
    -- ab. Entspricht der eingebauten Vorgabe von neanderfunk-common.
    -- Achtung: 490-neanderfunk-common uebernimmt den Wert nur auf Knoten, die
    -- noch keinen eigenen haben, und kann einen von hier uebernommenen nicht
    -- von einem von Hand gesetzten unterscheiden. Einmal angekommen, erreicht
    -- eine spaetere Aenderung hier diese Knoten nicht mehr.
    reboot_log_max = 6,
  },
}